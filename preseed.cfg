# Unattended Debian installation for a KVM host.
# The installer asks only for: username, password, system disk.

#### Language, country, keyboard
d-i debian-installer/language string en
d-i debian-installer/country string UA
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

#### Network via DHCP; build-iso.sh replaces kvm01 and example.com
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kvm01
d-i netcfg/get_domain string example.com
d-i netcfg/hostname string kvm01
d-i hw-detect/load_firmware boolean true

#### Package mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#### User: root login disabled, so the user is added to the sudo group
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string

#### Time
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Kyiv
d-i clock-setup/ntp boolean true

#### Partitioning: disk not set, so the installer asks for it; then LVM on the whole disk without confirmations
d-i partman-auto/init_automatically_partition select some_device_lvm
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

#### Packages
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
popularity-contest popularity-contest/participate boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo qemu-system-x86 libvirt-daemon-system libvirt-dbus virtinst cockpit cockpit-machines network-manager parted whiptail wget
d-i pkgsel/upgrade select full-upgrade

#### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

#### After installation: first-boot script, login on serial port ttyS0, sudo without re-asking the password for the session
d-i preseed/late_command string \
  cp /cdrom/kvm-setup.sh /target/usr/local/sbin/kvm-setup; \
  chmod 755 /target/usr/local/sbin/kvm-setup; \
  cp /cdrom/kvm-setup.service /target/etc/systemd/system/kvm-setup.service; \
  in-target systemctl enable kvm-setup.service; \
  in-target systemctl enable serial-getty@ttyS0.service; \
  echo 'Defaults timestamp_timeout=-1' > /target/etc/sudoers.d/timeout; \
  chmod 440 /target/etc/sudoers.d/timeout

d-i finish-install/reboot_in_progress note
